<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>credit analysis</title>
</head>
<body>
    <h1>credit analysis sistem💰</h1>
    <p>what is your current salary?</p>
    <input type="number" id="salary" placeholder="enter the salary">
    <p>what is the amount of the installment you wish to pay?</p>

    <input type="number" id="installment" placeholder="enter the installment"><br><br>
    <button onclick="analyze()">analyze credit</button>

    <div id="result"></div>


    <script>
        function analyze() {
            let salary = document.getElementById("salary").value;
            let installment = document.getElementById("installment").value;
            let res = document.getElementById("result");
            //business rule: the installment can't be bigger than 30% of the salary
             
            let limit = salary * 0.3;
            //clean the previous result and define an basic style

            res.innerHTML= "";
            res.style.marginTop = "20px";
            res.style.fontWeight = "bold";

            //conditional structure if/else
            if (installment <= limit){
                res.innerHTML = "✔ APPROVED CREDIT<br>";
                res.innerHTML += "the value is at limit of R$" + limit;
                res.style.color = "darkgreen";
            }else{
                res.innerHTML = "❌ DENIED CREDIT<br>";
                res.innerHTML += "the portion of R$" + installment + "exceeds the limit of R$" + limit;
                res.style.color = "darkred";
            }
        }
    </script>
</body>
</html>
